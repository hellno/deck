[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
# Keep equal to the channel in rust-toolchain.toml.
rust-version = "1.100"
description = "{{app_name}}: a native desktop app for macOS and Linux, built on GPUI."
license = "0BSD"

[lints.rust]
unused_must_use = "deny"
# deny, not forbid: a reviewed `#[allow(unsafe_code)]` with a `// SAFETY:` comment stays possible.
unsafe_code = "deny"

[lints.clippy]
# Warn locally, `-D warnings` in CI. Priority -1 lets the lints below override the group.
all = { level = "warn", priority = -1 }
todo = "deny"
dbg_macro = "deny"

[dependencies]
gpui-kit = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tray-icon = { version = "0.24", optional = true }

[dev-dependencies]
# The test harness, for tests and examples/shot.rs. It stays out of the app binary.
gpui-kit = { version = "0.11", features = ["test-support"] }

[features]
default = []
tray = ["dep:tray-icon", "dep:gtk"]

# The Linux tray runs its own GTK loop (src/tray.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[package.metadata.bundle]
name = "{{app_name}}"
identifier = "{{bundle_qualifier}}.{{bundle_org}}.{{project-name}}"
icon = ["assets/icon.icns"]
category = "public.app-category.productivity"
short_description = "{{app_name}}"
long_description = "{{app_name}}: a native desktop app built on GPUI for macOS and Linux."
# Third-party licenses require their texts to ship with the app.
resources = ["NOTICE", "LICENSE", "LICENSE-APACHE", "LICENSE-LUCIDE"]
copyright = "Copyright (c) 2026 {{app_name}} contributors. 0BSD. Bundles Apache-2.0/ISC third-party code; see NOTICE."

[package.metadata.bundle.macos]
minimum_system_version = "11.0"
