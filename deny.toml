# Supply-chain policy, checked in CI: `cargo deny --all-features check`.

[advisories]
# Unmaintained crates only count when they are direct dependencies; vulnerability advisories
# apply to the whole tree.
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
    "CC0-1.0",
]
exceptions = [
    # Only under cfg(fuzzing), via rav1e, so never built into the app. cargo-deny checks every cfg.
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
# GPUI's platform dependencies need several versions of some crates.
multiple-versions = "allow"
wildcards = "deny"
deny = [
    { crate = "openssl", reason = "prefer rustls/ring; avoid OpenSSL CVE surface" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
