name: CI

# Deck is a cargo-generate TEMPLATE: its source carries {{ }} Liquid tokens (see
# cargo-generate.toml `include`) and does NOT build directly. Each job renders a throwaway
# project and runs that project's own gate (`just ci`), the same one forks get.
#
# Standard GitHub-hosted runners are free on public repos. If this repo goes private, gate
# the macOS job to tags/PRs; don't switch to "*-large" runners (billed even when public).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Rendered outside the checkout: a nested cargo project confuses cargo (rust-lang/cargo#9922),
  # and cargo-generate run from inside the template deletes the template's hook file.
  GEN: ${{ github.workspace }}/../gen

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-generate,just
      - name: Generate a project from the template
        run: |
          mkdir -p "$GEN" && cd "$GEN"
          cargo generate --path "$GITHUB_WORKSPACE" --name deck-ci --silent --vcs none --destination "$GEN"
      # rust-toolchain.toml (copied into the project) pins the compiler; rustup installs it.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ env.GEN }}/deck-ci
      - name: just ci (fmt, clippy on both feature sets, test, build)
        working-directory: ${{ env.GEN }}/deck-ci
        run: just ci

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # GPUI needs X11/Wayland/Vulkan/fonts; the tray feature needs GTK + appindicator.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-generate,just
      - name: Generate a project from the template
        run: |
          mkdir -p "$GEN" && cd "$GEN"
          cargo generate --path "$GITHUB_WORKSPACE" --name deck-ci --silent --vcs none --destination "$GEN"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ${{ env.GEN }}/deck-ci
      - name: just ci (fmt, clippy on both feature sets, test, build)
        working-directory: ${{ env.GEN }}/deck-ci
        run: just ci

  # Supply-chain gate on the generated project (the raw Cargo.toml has tokens), plus a check
  # that a display name survives generation verbatim.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-generate,cargo-deny
      - name: Generate "Catchy TV"
        run: |
          mkdir -p "$GEN" && cd "$GEN"
          cargo generate --path "$GITHUB_WORKSPACE" --name catchy-tv -d app_name="Catchy TV" --silent --vcs none --destination "$GEN"
      - name: Display name is verbatim, and no "Deck" leaks into the app
        working-directory: ${{ env.GEN }}/catchy-tv
        run: |
          grep -q 'APP_NAME: &str = "Catchy TV"' src/lib.rs
          grep -q '^# Catchy TV$' README.md
          grep -q 'Catchy TV contributors' LICENSE
          if grep -rIn -i '\bdeck\b' src examples Cargo.toml justfile AGENTS.md README.md docs scripts; then exit 1; fi
      - name: cargo-deny check
        working-directory: ${{ env.GEN }}/catchy-tv
        run: cargo deny --all-features check advisories bans sources licenses
