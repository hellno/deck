# Dependabot configuration for Deck — GitHub Actions only.
#
# No `cargo` ecosystem on purpose: this repo is a cargo-generate template, so Cargo.toml's
# package name is a `{{ }}` token and Dependabot's cargo parser rejects it. A generated app
# has real names, so its dependabot.yml (from dependabot.yml.liquid) includes cargo.
version: 2
updates:
  # GitHub Actions — keeps the SHA-pinned actions in ci.yml current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
